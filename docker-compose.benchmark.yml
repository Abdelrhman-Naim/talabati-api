name: aegis-benchmark
# Intentionally vulnerable local test stack. Not runtime-validated here (Docker unavailable).
# Registry images are digest-pinned; NodeGoat uses a pinned base and a verified official source commit.
# The locally built NodeGoat output image ID is recorded after build, never fabricated.
services:
  juice-shop:
    image: bkimminich/juice-shop:v15.1.0@sha256:76133a3b148276e0af522ffcd37a236c10e04e424718581674338dc4c64a6d46
    container_name: aegis-benchmark-juice-shop
    ports: ["127.0.0.1:3001:3000"]
    networks: [juice]
    restart: "no"
  nodegoat:
    image: aegis-benchmark-nodegoat:local-v1.4
    build:
      context: ./benchmark/external/NodeGoat
      dockerfile: ../../docker/NodeGoat.Dockerfile
    container_name: aegis-benchmark-nodegoat
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/nodegoat
    command: ["sh", "-c", "until nc -z -w 2 mongo 27017; do sleep 2; done; node artifacts/db-reset.js && npm start"]
    ports: ["127.0.0.1:3002:4000"]
    networks: [nodegoat]
    depends_on: [mongo]
    restart: "no"
  mongo:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
    user: mongodb
    networks: [nodegoat]
    restart: "no"
  dvwa:
    image: ghcr.io/digininja/dvwa:bc91fd5@sha256:bd84d202eed2b12756729d6afb53775952416860f522e56d35903de24a628c61
    container_name: aegis-benchmark-dvwa
    environment:
      DB_SERVER: db
    ports: ["127.0.0.1:3003:80"]
    networks: [dvwa]
    depends_on: [db]
    restart: "no"
  db:
    image: mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
    environment:
      MYSQL_ROOT_PASSWORD: FAKE-BENCHMARK-ROOT-ONLY
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    networks: [dvwa]
    restart: "no"
networks:
  juice:
    internal: true
  nodegoat:
    internal: true
  dvwa:
    internal: true
