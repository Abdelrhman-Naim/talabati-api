services:
  web:
    build: .
    command: ["npm", "run", "start"]
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
    volumes:
      - audit-data:/app/data
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
    volumes:
      - audit-data:/app/data
    restart: unless-stopped
volumes:
  audit-data:
